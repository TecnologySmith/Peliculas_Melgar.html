<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Redirigiendo... | TecnologySmith</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 80px 20px; }
    h1 { color: #ffcc00; font-size: 3em; margin: 0 0 10px; }
    a { color: #ffcc00; font-weight: bold; }
  </style>
  <script>
    // Ejemplo: /Peliculas_Melgar.html/bts-el-regreso -> /Peliculas_Melgar.html#bts-el-regreso
    (function () {
      var m = location.pathname.match(/^(.*?\.html?)\/([^\/]+)\/?$/i);
      if (m) location.replace(m[1] + "#" + m[2] + location.search);
      else document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("msg").style.display = "block";
      });
    })();
  </script>
</head>
<body>
  <p>Cargando película...</p>
  <div id="msg" style="display:none">
    <h1>404</h1>
    <p>Esta página no existe.</p>
    <p><a href="/Peliculas_Melgar.html">Ir al catálogo de Películas Melgar</a></p>
  </div>
</body>
</html>
